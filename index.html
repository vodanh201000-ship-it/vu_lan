<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đặc tuyến Bán dẫn (Web Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-ai: #10b981;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; }
        .status { font-weight: bold; margin-top: 15px; color: #94a3b8; font-size: 15px; }

        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 12px; align-items: center; }
        .controls select { padding: 10px 15px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155; font-size: 14px; outline: none; }
        .controls select:focus { border-color: var(--accent-blue); }
        .btn-connect { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2); }
        .btn-connect:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-clear { padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-weight: bold; }
        .btn-clear:hover { background: #dc2626; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; margin-top: 10px; }
        .panel { background-color: var(--panel-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; border: 1px solid #334155; }
        .panel h2 { margin-top: 0; font-size: 16px; text-align: center; color: var(--text-main); font-weight: 600; letter-spacing: 0.5px; }
        .chart-container { position: relative; flex: 1; width: 100%; min-height: 350px; }

        .live-data { display: flex; justify-content: space-around; background: #0b1120; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #334155; }
        .data-box { text-align: center; }
        .data-box span { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .data-box strong { font-size: 28px; font-weight: bold; }

        .ai-controls { display: flex; justify-content: center; margin-top: 25px; }
        .btn-ai { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .btn-ai:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .btn-ai:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .ai-panel { margin-top: 25px; background: #1e293b; border-left: 4px solid var(--accent-ai); display: none; }
        .ai-panel h2 { color: var(--accent-ai); text-align: left; margin-bottom: 15px; font-size: 18px; }
        .ai-content { font-size: 15px; line-height: 1.7; color: #cbd5e1; }

        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Hệ Thống Thu Thập Dữ Liệu C-V & Mott-Schottky</h1>
        
        <div class="controls">
            <select id="port-select">
                <option value="">Đang truy xuất thiết bị phần cứng...</option>
            </select>
            <button class="btn-connect" onclick="connectHardware()">Kết Nối Thiết Bị</button>
            <button class="btn-clear" onclick="clearCharts()">Làm Sạch Giao Diện</button>
        </div>

        <div class="status" id="status-text">Hệ thống đang ở trạng thái Standby...</div>
    </div>

    <div class="dashboard">
        <div class="panel">
            <h2>ĐẶC TUYẾN C-V (Điện Dung - Điện Áp)</h2>
            <div class="chart-container"><canvas id="cvChart"></canvas></div>
        </div>
        <div class="panel">
            <h2>ĐẶC TUYẾN MOTT-SCHOTTKY (1/C²)</h2>
            <div class="chart-container"><canvas id="msChart"></canvas></div>
        </div>
    </div>

    <div class="live-data">
        <div class="data-box">
            <span>Điện Áp Phân Cực (V_bias)</span>
            <strong id="val-vbias" style="color: #ef4444;">0.00 V</strong>
        </div>
        <div class="data-box">
            <span>Điện Dung (C)</span>
            <strong id="val-c" style="color: var(--accent-blue);">0.000 pF</strong>
        </div>
        <div class="data-box">
            <span>Tỉ Lệ Mott-Schottky (1/C²)</span>
            <strong id="val-invc2" style="color: var(--accent-purple);">0.0000</strong>
        </div>
    </div>

    <div class="ai-controls">
        <button class="btn-ai" id="btn-analyze" onclick="analyzeWithGemini()">
            ✨ Trích Xuất Báo Cáo Vật Lý (AI) ✨
            <div class="loading-spinner" id="ai-loader"></div>
        </button>
    </div>

    <div class="panel ai-panel" id="ai-result-panel">
        <h2>✨ Kết Quả Suy Luận Chuyên Gia</h2>
        <div class="ai-content" id="ai-response-content"></div>
    </div>

    <script>
        // Cấu hình vô hiệu hóa Animation của Chart.js để vẽ phần cứng thời gian thực mượt nhất
        const commonOptions = {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: {
                x: { type: 'linear', title: { display: true, text: 'Điện áp (V)', color: '#94a3b8' }, grid: { color: '#334155' }, ticks: { color: '#94a3b8' }},
                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }}
            }, plugins: { legend: { display: false } }
        };

        const ctxCV = document.getElementById('cvChart').getContext('2d');
        const cvChart = new Chart(ctxCV, {
            type: 'line',
            data: { datasets: [{ label: 'C (pF)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, pointBackgroundColor: '#ef4444', pointRadius: 2, fill: true, tension: 0.1 }]},
            options: { ...commonOptions, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, title: { display: true, text: 'Điện dung (pF)', color: '#3b82f6' }}}}
        });

        const ctxMS = document.getElementById('msChart').getContext('2d');
        const msChart = new Chart(ctxMS, {
            type: 'line',
            data: { datasets: [{ label: '1/C²', data: [], borderColor: '#a855f7', borderWidth: 2, pointBackgroundColor: '#a855f7', pointRadius: 2, tension: 0 }]},
            options: { ...commonOptions, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, title: { display: true, text: '1/C² (pF⁻²)', color: '#a855f7' }}}}
        });

        window.clearCharts = function() {
            cvChart.data.datasets[0].data = []; msChart.data.datasets[0].data = [];
            cvChart.update(); msChart.update();
            document.getElementById('val-vbias').innerText = "0.00 V";
            document.getElementById('val-c').innerText = "0.000 pF";
            document.getElementById('val-invc2').innerText = "0.0000";
            document.getElementById('status-text').innerText = "Bộ nhớ đệm đã được dọn sạch.";
            document.getElementById('status-text').style.color = "#94a3b8";
            document.getElementById('ai-result-panel').style.display = 'none';
        };

        let ws;

        async function loadPorts() {
            try {
                const response = await fetch('/api/ports');
                const data = await response.json();
                const select = document.getElementById('port-select');
                select.innerHTML = '<option value="">-- Chọn Cổng Vật Lý / Mô Phỏng --</option>';
                data.ports.forEach(port => {
                    const option = document.createElement('option');
                    option.value = port; option.text = port;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerText = "Lỗi: Không tìm thấy Backend Server!";
                document.getElementById('status-text').style.color = "#ef4444";
            }
        }
        
        window.onload = loadPorts;

        function connectHardware() {
            const selectedPort = document.getElementById('port-select').value;
            if (!selectedPort) return alert("Hệ thống yêu cầu xác định giao thức phần cứng (Cổng COM)!");

            if (ws && ws.readyState === WebSocket.OPEN) ws.close();

            ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onopen = () => ws.send(selectedPort);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "status") {
                    document.getElementById('status-text').innerText = data.msg;
                    document.getElementById('status-text').style.color = data.color;
                } else if (data.type === "data") {
                    document.getElementById('val-vbias').innerText = data.v_bias.toFixed(2) + " V";
                    document.getElementById('val-c').innerText = data.c_pf.toFixed(3) + " pF";
                    document.getElementById('val-invc2').innerText = data.inv_c2.toFixed(4);

                    cvChart.data.datasets[0].data.push({x: data.v_bias, y: data.c_pf});
                    msChart.data.datasets[0].data.push({x: data.v_bias, y: data.inv_c2});

                    cvChart.update(); msChart.update();
                }
            };

            ws.onerror = () => {
                document.getElementById('status-text').innerText = "Cảnh báo: Mất kết nối đường truyền WebSocket!";
                document.getElementById('status-text').style.color = "#ef4444";
            };
        }

        // ================= GEMINI AI LOGIC =================
        const apiKey = ""; // ĐIỀN API KEY NẾU CẦN PHÂN TÍCH

        async function fetchWithRetry(url, options, retries = 3) {
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    return await response.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        async function analyzeWithGemini() {
            const dataPoints = cvChart.data.datasets[0].data;
            if (dataPoints.length === 0) return alert("Trống dữ liệu. Yêu cầu chạy quét phần cứng trước khi phân tích!");
            if (!apiKey) return alert("Thiếu cấu hình Token API cho module suy luận.");

            document.getElementById('ai-loader').style.display = 'inline-block';
            const btn = document.getElementById('btn-analyze');
            btn.disabled = true;

            let dataSummary = "V_bias(V) | C(pF) | 1/C²(pF⁻²)\n";
            const msPoints = msChart.data.datasets[0].data;
            const step = Math.max(1, Math.floor(dataPoints.length / 20));
            for(let i = 0; i < dataPoints.length; i += step) {
                dataSummary += `${dataPoints[i].x.toFixed(2)} | ${dataPoints[i].y.toFixed(3)} | ${msPoints[i].y.toFixed(4)}\n`;
            }

            const prompt = `Phân tích dữ liệu C-V bán dẫn sau:\n${dataSummary}\n1. Xu hướng thay đổi điện dung? (Chế độ phân cực).\n2. Tuyến tính Mott-Schottky và loại pha tạp?\n3. Kết luận ngắn gọn.`;
            const systemPrompt = "Đóng vai chuyên gia vật lý linh kiện. Trả lời kỹ thuật, ngắn gọn, dùng thuật ngữ chính xác.";

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const response = await fetchWithRetry(url, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });

                const aiText = response.candidates?.[0]?.content?.parts?.[0]?.text || "Không nhận được luồng phản hồi.";
                document.getElementById('ai-response-content').innerHTML = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                const panel = document.getElementById('ai-result-panel');
                panel.style.display = 'block';
                panel.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                document.getElementById('ai-response-content').innerHTML = `<span style="color: #ef4444;">Lỗi Module AI: ${error.message}</span>`;
                document.getElementById('ai-result-panel').style.display = 'block';
            } finally {
                document.getElementById('ai-loader').style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
